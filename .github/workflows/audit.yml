name: Audit

# Checks the dependencies with cargo-deny (see deny.toml): known vulnerabilities and yanked crates
# (RustSec advisory database), licenses, and where crates come from. New advisories appear without
# any change to the repository, so it also runs every week.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
