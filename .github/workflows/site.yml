name: Site

# Builds the website in `site/` and publishes it with GitHub Pages (launcher.breakbar.cc).
# The site goes live from the `release` branch, like the program, so it never describes something
# that has not been released. See "Website" in CONTRIBUTING.md.
on:
  push:
    branches: [release]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  # A pull request (into main) only builds the site, which catches a missing text or a broken template.
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  # Also started by the release workflow, so that the version on the page follows a new release.
  workflow_dispatch:

# One deployment at a time; a later run waits instead of racing the earlier one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The page shows the newest published version. Before the first release exists the build
      # falls back to the version in Cargo.toml.
      - name: Find the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$tag" ]; then
            echo "SITE_VERSION=${tag#v}" >> "$GITHUB_ENV"
            echo "Newest release: $tag"
          else
            echo "No release yet, the version comes from Cargo.toml."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: ${{ github.event_name != 'pull_request' }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: ${{ github.event_name != 'pull_request' }}
        with:
          path: site/_site

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
