name: Site

# Builds the website in `site/` and publishes it with GitHub Pages (launcher.breakbar.cc).
# The site goes live from the `release` branch, like the program, so it never describes something
# that has not been released. See "Website" in CONTRIBUTING.md.
on:
  push:
    branches: [release]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  # A pull request (into main) only builds the site, which catches a missing text or a broken template.
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  # Also started by the release workflow, so that the version on the page follows a new release.
  workflow_dispatch:

# One deployment at a time; a later run waits instead of racing the earlier one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The page shows the newest published version. Before the first release exists the build
      # falls back to the version in Cargo.toml.
      - name: Find the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$tag" ]; then
            echo "SITE_VERSION=${tag#v}" >> "$GITHUB_ENV"
            echo "Newest release: $tag"
          else
            echo "No release yet, the version comes from Cargo.toml."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: ${{ github.event_name != 'pull_request' }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          path: site/_site

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
