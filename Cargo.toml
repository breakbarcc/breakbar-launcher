[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Patrick Schmidt"]
repository = "https://github.com/breakbarcc/breakbar-launcher"

[workspace.dependencies]
bb-core = { path = "crates/bb-core" }
bb-store = { path = "crates/bb-store" }
bb-win = { path = "crates/bb-win" }

embed-resource = "3.0.11"
lexopt = "0.3.2"
raw-window-handle = "0.6.2"
sys-locale = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-software",
  "software-renderer-systemfonts",
  "software-renderer-path",
  "accessibility",
  "raw-window-handle-06",
] }
slint-build = "1.18.1"
thiserror = "2.0.21"
toml = "1.1.6"
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Slint hands ids and sizes over as `i32`, and Win32 structs carry their own size fields as `u32`;
# every such cast is on a small value.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Colors are written as 0xRRGGBB.
unreadable_literal = "allow"
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
